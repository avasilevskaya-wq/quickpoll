<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick poll</title>
<meta name="description" content="A quick poll — just tap your answers. About a minute.">
<meta property="og:title" content="Quick poll — tap to answer">
<meta property="og:description" content="Just a few taps, about a minute. No sign-up needed.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/base.css?v=1.8">
<link rel="stylesheet" href="../assets/ui.css?v=2.7">
<link rel="stylesheet" href="../assets/survey.css?v=2.2">
<style>
  html, body { height: 100%; }
  body { display: flex; justify-content: center; overflow-x: clip; }
  .page { width: 100%; max-width: 680px; min-height: 100%; display: flex; flex-direction: column; }
  .page .qp-runner { flex: 1; }
  @media (min-width: 680px) {
    body { align-items: flex-start; padding: 40px 24px; }
    .page { min-height: 0; }
    /* room for button shadows: the runner clips horizontally (for the slide-in animation) */
    .page .qp-runner { margin: 0 -56px; padding: 0 56px; }
    .page .qp-top { padding: 0 8px; }
    .page .qp-screen { padding: 36px 8px 48px; }
  }
  .state { padding: 72px 24px; text-align: center; }
  .state h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 10px; }
  .state p { font-weight: 400; color: var(--ui-ink-muted); margin: 0 auto 26px; max-width: 420px; line-height: 1.55; }
  .banner { margin: 12px 20px 0; padding: 10px 16px; font-size: 14px; font-weight: 500; border-radius: 14px; background: var(--ui-face-top); color: var(--ui-ink); box-shadow: 0 0 0 1px rgba(var(--ui-glow), .38); text-align: center; }
  .loading { padding: 80px 24px; text-align: center; color: var(--ui-ink-muted); }
</style>
</head>
<body>
<main class="page" id="page">
  <div class="loading">Loading…</div>
</main>
<noscript><p style="padding:24px;text-align:center">Please enable JavaScript to answer this poll.</p></noscript>
<script src="../config.js?v=1.7"></script>
<script src="../assets/shared.js?v=2.2"></script>
<script>
(function () {
  'use strict';
  var el = QP.el;
  var page = document.getElementById('page');
  var cfg = window.QP_CONFIG || {};

  function showState(title, text, button) {
    page.textContent = '';
    page.appendChild(el('div', { class: 'qp-runner' }, el('div', { class: 'state' }, [
      el('h1', { text: title }), el('p', { text: text }), button || null
    ])));
  }

  function postJSON(url, data) {
    var body = JSON.stringify(data);
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 25000) : null;
    var clear = function () { if (timer) clearTimeout(timer); };
    // text/plain keeps this a "simple" request (no CORS preflight), which Apps Script accepts.
    return fetch(url, { method: 'POST', body: body, redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        return r.text().then(function (t) {
          var j = null; try { j = JSON.parse(t); } catch (e) { /* not JSON */ }
          if (j && j.ok === false) throw new Error(j.error || 'Rejected');
          if (!r.ok && !j) throw new Error('HTTP ' + r.status);
          return j;
        });
      }, function (err) {
        if (err && err.name === 'AbortError') throw new Error('Timed out');
        // Response unreadable (CORS) or network issue: retry without reading the response.
        // The submission id makes the retry safe — the script ignores duplicates.
        return fetch(url, { method: 'POST', body: body, mode: 'no-cors' }).then(function () { return { ok: true, opaque: true }; });
      })
      .then(function (x) { clear(); return x; }, function (e) { clear(); throw e; });
  }

  function start(survey, code) {
    var endpoint = survey.e || cfg.endpoint || '';
    document.title = survey.t ? survey.t + ' — quick poll' : 'Quick poll';
    var doneKey = 'qp_done_' + survey.id;
    var progressKey = 'qp_progress_' + survey.id + '_' + code.length;
    var subKey = 'qp_sub_' + survey.id;

    function run() {
      page.textContent = '';
      if (!endpoint) {
        page.appendChild(el('p', { class: 'banner', text: 'Test mode: this poll isn’t connected to a sheet yet, so answers won’t be saved.' }));
      }
      var host = el('div', { class: 'qp-runner' });
      page.appendChild(host);
      new QP.Runner(host, survey, {
        storageKey: progressKey,
        ui: true,
        onSubmit: function (payload) {
          // one id per attempt series, reused on retry so the sheet never gets duplicates
          var subId = QP.store.get(subKey, null);
          if (!subId) { subId = QP.uid(12); QP.store.set(subKey, subId); }
          payload.subId = subId;
          payload.website = ''; // honeypot (bots fill everything)
          if (!endpoint) return new Promise(function (_, rej) { setTimeout(function () { rej(new Error('Not connected')); }, 400); });
          return postJSON(endpoint, payload).then(function () {
            QP.store.set(doneKey, new Date().toISOString());
            QP.store.del(subKey);
          });
        }
      });
    }

    if (QP.store.get(doneKey, null)) {
      showState('You’ve already answered', 'Thanks — your answers were sent. Need to change something? You can answer again.',
        el('button', { class: 'ui-btn ui-btn--primary', type: 'button', onclick: function () { QP.store.del(doneKey); run(); } }, el('span', { class: 'ui-btn__face' }, 'Answer again')));
      return;
    }
    run();
  }

  function load() {
    var code = location.hash.replace(/^#/, '');
    if (!code) {
      showState('This link looks incomplete', 'Please ask the person who sent it to share the full link again.');
      return;
    }
    QP.decode(code).then(function (s) {
      if (!s.q.length) throw new Error('broken');
      start(s, code);
    }, function (err) {
      if (err && err.message === 'old-browser') {
        showState('Please update your browser', 'This poll needs a newer browser version. Try opening the link in Chrome, Safari or Edge.');
      } else {
        showState('This link looks broken', 'Part of the link may have been cut off. Please ask the sender to share it again.');
      }
    });
  }

  window.addEventListener('hashchange', function () { location.reload(); });
  load();
})();
</script>
</body>
</html>
